name: Build Docker Images

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment (ci or production)'
        required: true
        type: string
      api_url:
        description: 'API URL for frontend builds'
        required: true
        type: string
      tag_suffix:
        description: 'Tag suffix (e.g., pr-123 or commit SHA)'
        required: true
        type: string
      base_ref:
        description: 'Base git ref for change detection (e.g., origin/main or HEAD~1)'
        required: false
        type: string
        default: ''
      force_build:
        description: 'Force build all images regardless of changes'
        required: false
        type: boolean
        default: false
    outputs:
      image_tag:
        description: 'The image tag that was built'
        value: ${{ jobs.build.outputs.image_tag }}
      www_web_built:
        description: 'Whether www-web was built'
        value: ${{ jobs.build.outputs.www_web_built }}
      app_web_built:
        description: 'Whether app-web was built'
        value: ${{ jobs.build.outputs.app_web_built }}
      api_service_built:
        description: 'Whether api-service was built'
        value: ${{ jobs.build.outputs.api_service_built }}
      user_service_built:
        description: 'Whether user-service was built'
        value: ${{ jobs.build.outputs.user_service_built }}
      agent_service_built:
        description: 'Whether agent-service was built'
        value: ${{ jobs.build.outputs.agent_service_built }}
      strava_service_built:
        description: 'Whether strava-mcp-server was built'
        value: ${{ jobs.build.outputs.strava_service_built }}

env:
  DOCKERHUB_USERNAME: crowprose
  REGISTRY: docker.io
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      www_web: ${{ steps.changes.outputs.www_web }}
      app_web: ${{ steps.changes.outputs.app_web }}
      api_service: ${{ steps.changes.outputs.api_service }}
      user_service: ${{ steps.changes.outputs.user_service }}
      agent_service: ${{ steps.changes.outputs.agent_service }}
      strava_service: ${{ steps.changes.outputs.strava_service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read pnpm version
        id: pnpm-version
        run: echo "version=$(cat package.json | jq -r .packageManager | sed 's/pnpm@//' | sed 's/\"//g')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect affected packages
        id: changes
        run: |
          BASE_REF="${{ inputs.base_ref }}"
          FORCE_BUILD="${{ inputs.force_build }}"

          # If force_build is true, mark all as changed
          if [ "$FORCE_BUILD" = "true" ]; then
            echo "Force build enabled - all packages marked as changed"
            echo "www_web=true" >> $GITHUB_OUTPUT
            echo "app_web=true" >> $GITHUB_OUTPUT
            echo "api_service=true" >> $GITHUB_OUTPUT
            echo "user_service=true" >> $GITHUB_OUTPUT
            echo "agent_service=true" >> $GITHUB_OUTPUT
            echo "strava_service=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # If no base_ref provided, build all
          if [ -z "$BASE_REF" ]; then
            echo "No base_ref provided - building all images"
            echo "www_web=true" >> $GITHUB_OUTPUT
            echo "app_web=true" >> $GITHUB_OUTPUT
            echo "api_service=true" >> $GITHUB_OUTPUT
            echo "user_service=true" >> $GITHUB_OUTPUT
            echo "agent_service=true" >> $GITHUB_OUTPUT
            echo "strava_service=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Verify BASE_REF exists (handles first commit edge case)
          if ! git rev-parse --verify "$BASE_REF" >/dev/null 2>&1; then
            echo "BASE_REF '$BASE_REF' does not exist - building all images"
            echo "www_web=true" >> $GITHUB_OUTPUT
            echo "app_web=true" >> $GITHUB_OUTPUT
            echo "api_service=true" >> $GITHUB_OUTPUT
            echo "user_service=true" >> $GITHUB_OUTPUT
            echo "agent_service=true" >> $GITHUB_OUTPUT
            echo "strava_service=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "Detecting changes against: $BASE_REF"
          echo "Changed files:"
          git diff --name-only "$BASE_REF"..HEAD | head -20
          echo ""

          # Get all packages affected by changes since BASE_REF using pnpm filter
          echo "Getting affected packages..."
          AFFECTED_PACKAGES=$(pnpm ls -r --depth -1 --filter="...[$BASE_REF]" --json 2>/dev/null | jq -r '.[].name' 2>/dev/null || echo "")
          echo "Affected packages:"
          echo "$AFFECTED_PACKAGES"
          echo ""

          # Helper function to check if a package or its dependencies are affected
          check_package() {
            local pkg=$1
            local output_var=$2

            # Get all packages that would trigger a rebuild of this package (itself + dependencies)
            local trigger_packages=$(pnpm ls -r --depth -1 --filter="${pkg}..." --json 2>/dev/null | jq -r '.[].name' 2>/dev/null || echo "")

            # Check if any affected package is in the trigger list
            local found=false
            for affected in $AFFECTED_PACKAGES; do
              for trigger in $trigger_packages; do
                if [ "$affected" = "$trigger" ]; then
                  found=true
                  break 2
                fi
              done
            done

            if [ "$found" = "true" ]; then
              echo "${output_var}=true" >> $GITHUB_OUTPUT
              echo "${pkg}: changes detected (will build)"
            else
              echo "${output_var}=false" >> $GITHUB_OUTPUT
              echo "${pkg}: no changes"
            fi
          }

          check_package "@app/www" "www_web"
          check_package "@app/dashboard" "app_web"
          check_package "@gateway/service" "api_service"
          check_package "@users/service" "user_service"
          check_package "@agent/service" "agent_service"
          check_package "@strava/mcp-server" "strava_service"

  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: detect-changes

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}
      www_web_built: ${{ steps.build-www-web.outcome == 'success' }}
      app_web_built: ${{ steps.build-app-web.outcome == 'success' }}
      api_service_built: ${{ steps.build-api-service.outcome == 'success' }}
      user_service_built: ${{ steps.build-user-service.outcome == 'success' }}
      agent_service_built: ${{ steps.build-agent-service.outcome == 'success' }}
      strava_service_built: ${{ steps.build-strava-service.outcome == 'success' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.tag_suffix }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push www-web
        id: build-www-web
        if: needs.detect-changes.outputs.www_web == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/www/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/www-web:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_API_URL=${{ inputs.api_url }}
            VITE_PUBLIC_POSTHOG_KEY=${{ secrets.POSTHOG_KEY }}
            VITE_PUBLIC_POSTHOG_HOST=${{ secrets.POSTHOG_HOST }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Skip www-web (no changes)
        if: needs.detect-changes.outputs.www_web != 'true'
        run: echo "Skipping www-web build - no changes detected"

      - name: Build and push app-web
        id: build-app-web
        if: needs.detect-changes.outputs.app_web == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/dashboard/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/app-web:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_API_URL=${{ inputs.api_url }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Skip app-web (no changes)
        if: needs.detect-changes.outputs.app_web != 'true'
        run: echo "Skipping app-web build - no changes detected"

      - name: Build and push api-service
        id: build-api-service
        if: needs.detect-changes.outputs.api_service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/@gateway/service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/api-service:${{ steps.meta.outputs.tag }}
          build-args: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Skip api-service (no changes)
        if: needs.detect-changes.outputs.api_service != 'true'
        run: echo "Skipping api-service build - no changes detected"

      - name: Build and push user-service
        id: build-user-service
        if: needs.detect-changes.outputs.user_service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/@users/service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/user-service:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Skip user-service (no changes)
        if: needs.detect-changes.outputs.user_service != 'true'
        run: echo "Skipping user-service build - no changes detected"

      - name: Build and push user-db-migrate
        id: build-user-db-migrate
        if: needs.detect-changes.outputs.user_service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/@users/db/Dockerfile.migrate
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/user-db-migrate:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push agent-service
        id: build-agent-service
        if: needs.detect-changes.outputs.agent_service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/@agent/service/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/agent-service:${{ steps.meta.outputs.tag }}
          build-args: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Skip agent-service (no changes)
        if: needs.detect-changes.outputs.agent_service != 'true'
        run: echo "Skipping agent-service build - no changes detected"

      - name: Build and push agent-db-migrate
        id: build-agent-db-migrate
        if: needs.detect-changes.outputs.agent_service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/@agent/db/Dockerfile.migrate
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/agent-db-migrate:${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push strava-mcp-server
        id: build-strava-service
        if: needs.detect-changes.outputs.strava_service == 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/@strava/mcp-server/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/strava-mcp-server:${{ steps.meta.outputs.tag }}
          build-args: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Skip strava-mcp-server (no changes)
        if: needs.detect-changes.outputs.strava_service != 'true'
        run: echo "Skipping strava-mcp-server build - no changes detected"

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Image | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| www-web | ${{ needs.detect-changes.outputs.www_web == 'true' && 'Built ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| app-web | ${{ needs.detect-changes.outputs.app_web == 'true' && 'Built ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| api-service | ${{ needs.detect-changes.outputs.api_service == 'true' && 'Built ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| user-service | ${{ needs.detect-changes.outputs.user_service == 'true' && 'Built ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| user-db-migrate | ${{ needs.detect-changes.outputs.user_service == 'true' && 'Built ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-service | ${{ needs.detect-changes.outputs.agent_service == 'true' && 'Built ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-db-migrate | ${{ needs.detect-changes.outputs.agent_service == 'true' && 'Built ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| strava-mcp-server | ${{ needs.detect-changes.outputs.strava_service == 'true' && 'Built ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
