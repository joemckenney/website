name: Build Docker Images

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment (ci or production)'
        required: true
        type: string
      api_url:
        description: 'API URL for frontend builds'
        required: true
        type: string
      tag_suffix:
        description: 'Tag suffix (e.g., pr-123 or commit SHA)'
        required: true
        type: string
    outputs:
      image_tag:
        description: 'The image tag that was built'
        value: ${{ jobs.build.outputs.image_tag }}

env:
  DOCKERHUB_USERNAME: crowprose
  REGISTRY: docker.io
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  build:
    name: Build & Push Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image metadata
        id: meta
        run: |
          TAG="${{ inputs.tag_suffix }}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push www-app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/@www/app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/www-app:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_API_URL=${{ inputs.api_url }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push app-client
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/@app/app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/app-client:${{ steps.meta.outputs.tag }}
          build-args: |
            VITE_API_URL=${{ inputs.api_url }}
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push app-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/@api/app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/app-server:${{ steps.meta.outputs.tag }}
          build-args: |
            TURBO_TOKEN=${{ secrets.TURBO_TOKEN }}
            TURBO_TEAM=${{ secrets.TURBO_TEAM }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}
