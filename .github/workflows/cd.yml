name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggers

env:
  DOCKERHUB_USERNAME: crowprose
  REGISTRY: docker.io

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    timeout-minutes: 20

    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Read pnpm version
        id: pnpm-version
        run: echo "version=$(cat package.json | jq -r .packageManager | sed 's/pnpm@//' | sed 's/\"//g')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tags=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push www-app
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/@www/app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/www-app:latest
            ${{ env.DOCKERHUB_USERNAME }}/www-app:${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_API_URL=https://api.joemckenney.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push app-client
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/@app/app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/app-client:latest
            ${{ env.DOCKERHUB_USERNAME }}/app-client:${{ steps.meta.outputs.tags }}
          build-args: |
            VITE_API_URL=https://api.joemckenney.com
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build and push app-server
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/@api/app/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKERHUB_USERNAME }}/app-server:latest
            ${{ env.DOCKERHUB_USERNAME }}/app-server:${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.repositoryUrl }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
            org.opencontainers.image.revision=${{ github.sha }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-and-push
    environment:
      name: production
      url: https://www.joemckenney.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy www-app
        run: |
          helm upgrade --install www-app apps/@www/app/helm \
            -f apps/@www/app/helm/values-prod.yaml \
            --set image.tag=latest \
            --wait \
            --timeout=5m

      - name: Deploy app-client
        run: |
          helm upgrade --install app-client apps/@app/app/helm \
            -f apps/@app/app/helm/values-prod.yaml \
            --set image.tag=latest \
            --wait \
            --timeout=5m

      - name: Deploy app-server
        run: |
          helm upgrade --install app-server apps/@api/app/helm \
            -f apps/@api/app/helm/values-prod.yaml \
            --set image.tag=latest \
            --wait \
            --timeout=5m

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/www-app --timeout=3m
          kubectl rollout status deployment/app-client --timeout=3m
          kubectl rollout status deployment/app-server --timeout=3m

      - name: Run production smoke tests
        run: |
          # Wait for ingress to update
          sleep 30

          # Test www-app
          echo "Testing www.joemckenney.com..."
          curl -f -s -o /dev/null -w "%{http_code}" https://www.joemckenney.com | grep -q "200" || exit 1

          # Test app-client
          echo "Testing app.joemckenney.com..."
          curl -f -s -o /dev/null -w "%{http_code}" https://app.joemckenney.com | grep -q "200" || exit 1

          # Test app-server
          echo "Testing api.joemckenney.com/ping..."
          curl -f -s https://api.joemckenney.com/ping | grep -q "pong" || exit 1

          echo "✅ All smoke tests passed!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed, rolling back..."
          helm rollback www-app 0 --wait || true
          helm rollback app-client 0 --wait || true
          helm rollback app-server 0 --wait || true

      - name: Get deployment status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress
          echo ""
          echo "=== Certificates ==="
          kubectl get certificate

  deployment-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Deployment to production succeeded!"
            echo "🌐 Live at: https://www.joemckenney.com"
          else
            echo "❌ Deployment to production failed!"
            exit 1
          fi
