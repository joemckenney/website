name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force rebuild all images'
        required: false
        default: false
        type: boolean

env:
  DOCKERHUB_USERNAME: crowprose

jobs:
  build-production-images:
    name: Build Production Images
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      environment: production
      api_url: https://api.joemckenney.com
      tag_suffix: sha-${{ github.sha }}
      # Compare to previous commit on main to detect what changed in this merge
      base_ref: HEAD~1
      # Allow manual force rebuild via workflow_dispatch
      force_build: ${{ inputs.force_build == true }}

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-production-images
    environment:
      name: production
      url: https://www.joemckenney.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy www-web
        if: needs.build-production-images.outputs.www_web_built == 'true'
        run: |
          helm upgrade --install www-web apps/www/helm \
            -f apps/www/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --wait \
            --timeout=5m

      - name: Skip www-web deployment (no changes)
        if: needs.build-production-images.outputs.www_web_built != 'true'
        run: echo "Skipping www-web deployment - no changes detected"

      - name: Deploy app-web
        if: needs.build-production-images.outputs.app_web_built == 'true'
        run: |
          helm upgrade --install app-web apps/dashboard/helm \
            -f apps/dashboard/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --wait \
            --timeout=5m

      - name: Skip app-web deployment (no changes)
        if: needs.build-production-images.outputs.app_web_built != 'true'
        run: echo "Skipping app-web deployment - no changes detected"

      - name: Deploy user-service
        if: needs.build-production-images.outputs.user_service_built == 'true'
        run: |
          helm upgrade --install user-service services/@users/service/helm \
            -f services/@users/service/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --set secrets.databaseUrl="${{ secrets.USER_SERVICE_DATABASE_URL }}" \
            --wait \
            --timeout=5m

      - name: Skip user-service deployment (no changes)
        if: needs.build-production-images.outputs.user_service_built != 'true'
        run: echo "Skipping user-service deployment - no changes detected"

      - name: Deploy api-service
        if: needs.build-production-images.outputs.api_service_built == 'true'
        run: |
          helm upgrade --install api-service services/@gateway/service/helm \
            -f services/@gateway/service/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --set secrets.googleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set secrets.googleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}" \
            --wait \
            --timeout=5m

      - name: Skip api-service deployment (no changes)
        if: needs.build-production-images.outputs.api_service_built != 'true'
        run: echo "Skipping api-service deployment - no changes detected"

      - name: Deploy agent-service
        if: needs.build-production-images.outputs.agent_service_built == 'true'
        run: |
          helm upgrade --install agent-service services/@agent/service/helm \
            -f services/@agent/service/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --set secrets.databaseUrl="${{ secrets.AGENT_SERVICE_DATABASE_URL }}" \
            --set secrets.anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --set secrets.braveApiKey="${{ secrets.BRAVE_API_KEY }}" \
            --wait \
            --timeout=5m

      - name: Skip agent-service deployment (no changes)
        if: needs.build-production-images.outputs.agent_service_built != 'true'
        run: echo "Skipping agent-service deployment - no changes detected"

      - name: Deploy tables-service
        if: needs.build-production-images.outputs.tables_service_built == 'true'
        run: |
          helm upgrade --install tables-service services/@tables/service/helm \
            -f services/@tables/service/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --set secrets.databaseUrl="${{ secrets.TABLES_SERVICE_DATABASE_URL }}" \
            --set secrets.anthropicApiKey="${{ secrets.ANTHROPIC_API_KEY }}" \
            --wait \
            --timeout=5m

      - name: Skip tables-service deployment (no changes)
        if: needs.build-production-images.outputs.tables_service_built != 'true'
        run: echo "Skipping tables-service deployment - no changes detected"

      - name: Deploy strava-mcp-server
        if: needs.build-production-images.outputs.strava_service_built == 'true'
        run: |
          helm upgrade --install strava-mcp-server services/@strava/mcp-server/helm \
            -f services/@strava/mcp-server/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --set secrets.databaseUrl="${{ secrets.STRAVA_SERVICE_DATABASE_URL }}" \
            --set secrets.stravaClientId="${{ secrets.STRAVA_CLIENT_ID }}" \
            --set secrets.stravaClientSecret="${{ secrets.STRAVA_CLIENT_SECRET }}" \
            --set secrets.encryptionKey="${{ secrets.STRAVA_ENCRYPTION_KEY }}" \
            --wait \
            --timeout=5m

      - name: Skip strava-mcp-server deployment (no changes)
        if: needs.build-production-images.outputs.strava_service_built != 'true'
        run: echo "Skipping strava-mcp-server deployment - no changes detected"

      - name: Wait for rollout
        run: |
          # Only wait for deployments that were updated
          if [ "${{ needs.build-production-images.outputs.www_web_built }}" == "true" ]; then
            kubectl rollout status deployment/www-web --timeout=3m
          fi
          if [ "${{ needs.build-production-images.outputs.app_web_built }}" == "true" ]; then
            kubectl rollout status deployment/app-web --timeout=3m
          fi
          if [ "${{ needs.build-production-images.outputs.api_service_built }}" == "true" ]; then
            kubectl rollout status deployment/api-service --timeout=3m
          fi
          if [ "${{ needs.build-production-images.outputs.user_service_built }}" == "true" ]; then
            kubectl rollout status deployment/user-service --timeout=3m
          fi
          if [ "${{ needs.build-production-images.outputs.agent_service_built }}" == "true" ]; then
            kubectl rollout status deployment/agent-service --timeout=3m
          fi
          if [ "${{ needs.build-production-images.outputs.tables_service_built }}" == "true" ]; then
            kubectl rollout status deployment/tables-service --timeout=3m
          fi
          if [ "${{ needs.build-production-images.outputs.strava_service_built }}" == "true" ]; then
            kubectl rollout status deployment/strava-mcp-server --timeout=3m
          fi

      - name: Run production smoke tests
        run: |
          # Wait for pods to be ready (only if deployment exists)
          echo "Waiting for pods to be ready..."

          wait_for_deployment() {
            local name=$1
            if kubectl get deployment "$name" >/dev/null 2>&1; then
              echo "Waiting for $name..."
              kubectl wait --for=condition=ready pod -l app.kubernetes.io/name="$name" --timeout=120s
            else
              echo "Deployment $name not found, skipping..."
            fi
          }

          wait_for_deployment www-web
          wait_for_deployment app-web
          wait_for_deployment api-service
          wait_for_deployment user-service
          wait_for_deployment agent-service
          wait_for_deployment tables-service
          wait_for_deployment strava-mcp-server

          # Brief pause for ingress backend propagation
          sleep 5

          # Test www-app
          echo "Testing www.joemckenney.com..."
          curl -f -s -o /dev/null -w "%{http_code}" https://www.joemckenney.com | grep -q "200" || exit 1

          # Test app-client
          echo "Testing app.joemckenney.com..."
          curl -f -s -o /dev/null -w "%{http_code}" https://app.joemckenney.com | grep -q "200" || exit 1

          # Test app-server
          echo "Testing api.joemckenney.com/ping..."
          curl -f -s https://api.joemckenney.com/ping | grep -q "pong" || exit 1

          echo "✅ All smoke tests passed!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed, rolling back..."
          # Only rollback services that were deployed
          if [ "${{ needs.build-production-images.outputs.www_web_built }}" == "true" ]; then
            helm rollback www-web 0 --wait || true
          fi
          if [ "${{ needs.build-production-images.outputs.app_web_built }}" == "true" ]; then
            helm rollback app-web 0 --wait || true
          fi
          if [ "${{ needs.build-production-images.outputs.api_service_built }}" == "true" ]; then
            helm rollback api-service 0 --wait || true
          fi
          if [ "${{ needs.build-production-images.outputs.user_service_built }}" == "true" ]; then
            helm rollback user-service 0 --wait || true
          fi
          if [ "${{ needs.build-production-images.outputs.agent_service_built }}" == "true" ]; then
            helm rollback agent-service 0 --wait || true
          fi
          if [ "${{ needs.build-production-images.outputs.tables_service_built }}" == "true" ]; then
            helm rollback tables-service 0 --wait || true
          fi
          if [ "${{ needs.build-production-images.outputs.strava_service_built }}" == "true" ]; then
            helm rollback strava-mcp-server 0 --wait || true
          fi

      - name: Get deployment status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress
          echo ""
          echo "=== Certificates ==="
          kubectl get certificate

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| www-web | ${{ needs.build-production-images.outputs.www_web_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| app-web | ${{ needs.build-production-images.outputs.app_web_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| api-service | ${{ needs.build-production-images.outputs.api_service_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| user-service | ${{ needs.build-production-images.outputs.user_service_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| agent-service | ${{ needs.build-production-images.outputs.agent_service_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| tables-service | ${{ needs.build-production-images.outputs.tables_service_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| strava-mcp-server | ${{ needs.build-production-images.outputs.strava_service_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY

  deployment-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Deployment to production succeeded!"
            echo "🌐 Live at: https://www.joemckenney.com"
          else
            echo "❌ Deployment to production failed!"
            exit 1
          fi
