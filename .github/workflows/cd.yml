name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggers

env:
  DOCKERHUB_USERNAME: crowprose

jobs:
  build-production-images:
    name: Build Production Images
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      environment: production
      api_url: https://api.joemckenney.com
      auth_url: https://auth.joemckenney.com
      tag_suffix: sha-${{ github.sha }}
      # Detect changes against the previous commit on main
      # Use HEAD~1 to compare against the parent commit
      base_ref: HEAD~1

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build-production-images
    environment:
      name: production
      url: https://www.joemckenney.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy www-web
        if: needs.build-production-images.outputs.www_web_built == 'true'
        run: |
          helm upgrade --install www-web apps/@www/web/helm \
            -f apps/@www/web/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --wait \
            --timeout=5m

      - name: Skip www-web deployment (no changes)
        if: needs.build-production-images.outputs.www_web_built != 'true'
        run: echo "Skipping www-web deployment - no changes detected"

      - name: Deploy app-web
        if: needs.build-production-images.outputs.app_web_built == 'true'
        run: |
          helm upgrade --install app-web apps/@app/web/helm \
            -f apps/@app/web/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --wait \
            --timeout=5m

      - name: Skip app-web deployment (no changes)
        if: needs.build-production-images.outputs.app_web_built != 'true'
        run: echo "Skipping app-web deployment - no changes detected"

      - name: Deploy api-service
        if: needs.build-production-images.outputs.api_service_built == 'true'
        run: |
          helm upgrade --install api-service apps/@api/service/helm \
            -f apps/@api/service/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --set secrets.googleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set secrets.googleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}" \
            --wait \
            --timeout=5m

      - name: Skip api-service deployment (no changes)
        if: needs.build-production-images.outputs.api_service_built != 'true'
        run: echo "Skipping api-service deployment - no changes detected"

      - name: Deploy auth-service
        if: needs.build-production-images.outputs.auth_service_built == 'true'
        run: |
          helm upgrade --install auth-service apps/@auth/service/helm \
            -f apps/@auth/service/helm/values-prod.yaml \
            --set image.tag=sha-${{ github.sha }} \
            --set secrets.googleClientId="${{ secrets.GOOGLE_CLIENT_ID }}" \
            --set secrets.googleClientSecret="${{ secrets.GOOGLE_CLIENT_SECRET }}" \
            --set secrets.jwtSecret="${{ secrets.JWT_SECRET }}" \
            --wait \
            --timeout=5m

      - name: Skip auth-service deployment (no changes)
        if: needs.build-production-images.outputs.auth_service_built != 'true'
        run: echo "Skipping auth-service deployment - no changes detected"

      - name: Wait for rollout
        run: |
          # Only wait for deployments that were updated
          if [ "${{ needs.build-production-images.outputs.www_web_built }}" == "true" ]; then
            kubectl rollout status deployment/www-web --timeout=3m
          fi
          if [ "${{ needs.build-production-images.outputs.app_web_built }}" == "true" ]; then
            kubectl rollout status deployment/app-web --timeout=3m
          fi
          if [ "${{ needs.build-production-images.outputs.api_service_built }}" == "true" ]; then
            kubectl rollout status deployment/api-service --timeout=3m
          fi
          if [ "${{ needs.build-production-images.outputs.auth_service_built }}" == "true" ]; then
            kubectl rollout status deployment/auth-service --timeout=3m
          fi

      - name: Run production smoke tests
        run: |
          # Wait for ingress to update
          sleep 30

          # Test www-web
          echo "Testing www.joemckenney.com..."
          curl -f -s -o /dev/null -w "%{http_code}" https://www.joemckenney.com | grep -q "200" || exit 1

          # Test app-web
          echo "Testing app.joemckenney.com..."
          curl -f -s -o /dev/null -w "%{http_code}" https://app.joemckenney.com | grep -q "200" || exit 1

          # Test api-service
          echo "Testing api.joemckenney.com/ping..."
          curl -f -s https://api.joemckenney.com/ping | grep -q "pong" || exit 1

          # Test auth-service
          echo "Testing auth.joemckenney.com/docs..."
          curl -f -s -o /dev/null -w "%{http_code}" https://auth.joemckenney.com/docs | grep -q "200" || exit 1

          echo "✅ All smoke tests passed!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed, rolling back..."
          # Only rollback services that were deployed
          if [ "${{ needs.build-production-images.outputs.www_web_built }}" == "true" ]; then
            helm rollback www-web 0 --wait || true
          fi
          if [ "${{ needs.build-production-images.outputs.app_web_built }}" == "true" ]; then
            helm rollback app-web 0 --wait || true
          fi
          if [ "${{ needs.build-production-images.outputs.api_service_built }}" == "true" ]; then
            helm rollback api-service 0 --wait || true
          fi
          if [ "${{ needs.build-production-images.outputs.auth_service_built }}" == "true" ]; then
            helm rollback auth-service 0 --wait || true
          fi

      - name: Get deployment status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress
          echo ""
          echo "=== Certificates ==="
          kubectl get certificate

      - name: Deployment summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|---------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| www-web | ${{ needs.build-production-images.outputs.www_web_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| app-web | ${{ needs.build-production-images.outputs.app_web_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| api-service | ${{ needs.build-production-images.outputs.api_service_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| auth-service | ${{ needs.build-production-images.outputs.auth_service_built == 'true' && 'Deployed ✅' || 'Skipped ⏭️' }} |" >> $GITHUB_STEP_SUMMARY

  deployment-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Deployment to production succeeded!"
            echo "🌐 Live at: https://www.joemckenney.com"
          else
            echo "❌ Deployment to production failed!"
            exit 1
          fi
