name: CD

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Allow manual triggers

env:
  DOCKERHUB_USERNAME: crowprose

jobs:
  retag-images:
    name: Retag Images as Latest
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract PR number from merge commit
        id: pr
        run: |
          # Get commit message
          COMMIT_MSG=$(git log -1 --pretty=%B)
          echo "Commit message: $COMMIT_MSG"

          # Extract PR number from "Merge pull request #123" or "... (#123)"
          PR_NUM=$(echo "$COMMIT_MSG" | grep -oP '(?<=#)\d+' | head -1)

          if [ -z "$PR_NUM" ]; then
            echo "⚠️  No PR number found in commit message"
            echo "This might be a direct push to main - will use SHA instead"
            TAG="sha-$(echo ${{ github.sha }} | cut -c1-8)"
          else
            echo "Found PR #$PR_NUM"
            TAG="pr-${PR_NUM}"
          fi

          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Using tag: ${TAG}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Retag and push images
        run: |
          TAG="${{ steps.pr.outputs.tag }}"

          echo "Pulling images tagged as ${TAG}..."
          # Pull the PR-tagged images that were built in CI
          docker pull ${{ env.DOCKERHUB_USERNAME }}/www-app:${TAG}
          docker pull ${{ env.DOCKERHUB_USERNAME }}/app-client:${TAG}
          docker pull ${{ env.DOCKERHUB_USERNAME }}/app-server:${TAG}

          echo "Retagging as 'latest'..."
          # Retag as 'latest'
          docker tag ${{ env.DOCKERHUB_USERNAME }}/www-app:${TAG} ${{ env.DOCKERHUB_USERNAME }}/www-app:latest
          docker tag ${{ env.DOCKERHUB_USERNAME }}/app-client:${TAG} ${{ env.DOCKERHUB_USERNAME }}/app-client:latest
          docker tag ${{ env.DOCKERHUB_USERNAME }}/app-server:${TAG} ${{ env.DOCKERHUB_USERNAME }}/app-server:latest

          echo "Pushing 'latest' tags..."
          # Push 'latest' tags
          docker push ${{ env.DOCKERHUB_USERNAME }}/www-app:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/app-client:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/app-server:latest

          echo "✅ Promoted ${TAG} to latest"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: retag-images
    environment:
      name: production
      url: https://www.joemckenney.com

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'v1.28.0'

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Configure kubectl
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_PROD }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Verify cluster connection
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: Deploy www-app
        run: |
          helm upgrade --install www-app apps/@www/app/helm \
            -f apps/@www/app/helm/values-prod.yaml \
            --set image.tag=latest \
            --wait \
            --timeout=5m

      - name: Deploy app-client
        run: |
          helm upgrade --install app-client apps/@app/app/helm \
            -f apps/@app/app/helm/values-prod.yaml \
            --set image.tag=latest \
            --wait \
            --timeout=5m

      - name: Deploy app-server
        run: |
          helm upgrade --install app-server apps/@api/app/helm \
            -f apps/@api/app/helm/values-prod.yaml \
            --set image.tag=latest \
            --wait \
            --timeout=5m

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/www-app --timeout=3m
          kubectl rollout status deployment/app-client --timeout=3m
          kubectl rollout status deployment/app-server --timeout=3m

      - name: Run production smoke tests
        run: |
          # Wait for ingress to update
          sleep 30

          # Test www-app
          echo "Testing www.joemckenney.com..."
          curl -f -s -o /dev/null -w "%{http_code}" https://www.joemckenney.com | grep -q "200" || exit 1

          # Test app-client
          echo "Testing app.joemckenney.com..."
          curl -f -s -o /dev/null -w "%{http_code}" https://app.joemckenney.com | grep -q "200" || exit 1

          # Test app-server
          echo "Testing api.joemckenney.com/ping..."
          curl -f -s https://api.joemckenney.com/ping | grep -q "pong" || exit 1

          echo "✅ All smoke tests passed!"

      - name: Rollback on failure
        if: failure()
        run: |
          echo "⚠️ Deployment failed, rolling back..."
          helm rollback www-app 0 --wait || true
          helm rollback app-client 0 --wait || true
          helm rollback app-server 0 --wait || true

      - name: Get deployment status
        if: always()
        run: |
          echo "=== Pods ==="
          kubectl get pods -o wide
          echo ""
          echo "=== Services ==="
          kubectl get svc
          echo ""
          echo "=== Ingress ==="
          kubectl get ingress
          echo ""
          echo "=== Certificates ==="
          kubectl get certificate

  deployment-notification:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: deploy-production
    if: always()

    steps:
      - name: Deployment status
        run: |
          if [ "${{ needs.deploy-production.result }}" == "success" ]; then
            echo "✅ Deployment to production succeeded!"
            echo "🌐 Live at: https://www.joemckenney.com"
          else
            echo "❌ Deployment to production failed!"
            exit 1
          fi
