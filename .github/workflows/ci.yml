name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Read pnpm version
        id: pnpm-version
        run: echo "version=$(cat package.json | jq -r .packageManager | sed 's/pnpm@//' | sed 's/\"//g')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust for WASM
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          target: wasm32-unknown-unknown
          cache: true
          cache-workspaces: packages/@website/squared

      - name: Cache wasm-pack
        id: cache-wasm-pack
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/wasm-pack
          key: ${{ runner.os }}-wasm-pack-0.13.1

      - name: Install wasm-pack
        if: steps.cache-wasm-pack.outputs.cache-hit != 'true'
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh

      - name: Setup Go for topoftree
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: packages/@website/topoftree/go.sum

      - name: Format check
        run: pnpm biome check

      - name: Type check & Build
        run: pnpm turbo build

  validate-helm:
    name: Validate Helm Charts
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Lint Helm charts
        run: |
          helm lint apps/@www/app/helm
          helm lint apps/@app/app/helm
          helm lint apps/@api/app/helm

      - name: Validate templates (dry-run)
        run: |
          helm template www-app apps/@www/app/helm --validate
          helm template app-client apps/@app/app/helm --validate
          helm template app-server apps/@api/app/helm --validate

  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: quality-checks
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      environment: ci
      api_url: http://api.local.com
      # Tag with PR number so CD can find these images after merge
      tag_suffix: pr-${{ github.event.pull_request.number }}

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality-checks, validate-helm, build-images]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.quality-checks.result }}" != "success" ] || \
             [ "${{ needs.validate-helm.result }}" != "success" ] || \
             [ "${{ needs.build-images.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
