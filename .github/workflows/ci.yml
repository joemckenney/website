name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  quality-checks:
    name: Code Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read Node version
        id: node-version
        run: echo "version=$(cat .nvmrc)" >> $GITHUB_OUTPUT

      - name: Read pnpm version
        id: pnpm-version
        run: echo "version=$(cat package.json | jq -r .packageManager | sed 's/pnpm@//' | sed 's/\"//g')" >> $GITHUB_OUTPUT

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ steps.pnpm-version.outputs.version }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node-version.outputs.version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code quality check
        run: pnpm run check

      - name: Type check & Build
        run: pnpm turbo build

  validate-helm:
    name: Validate Helm Charts
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v3
        with:
          version: '3.13.0'

      - name: Lint Helm charts
        run: |
          helm lint apps/www/helm
          helm lint apps/dashboard/helm
          helm lint services/@gateway/service/helm
          helm lint services/@users/service/helm
          helm lint services/@agent/service/helm
          helm lint services/@strava/mcp-server/helm

      - name: Render templates (dry-run)
        run: |
          helm template www-web apps/www/helm
          helm template app-web apps/dashboard/helm
          helm template api-service services/@gateway/service/helm
          helm template user-service services/@users/service/helm
          helm template agent-service services/@agent/service/helm
          helm template strava-mcp-server services/@strava/mcp-server/helm

  build-images:
    name: Build Docker Images
    needs: quality-checks
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
    with:
      environment: ci
      api_url: http://api.local.com
      # Tag with commit SHA for traceability and potential reuse
      # (CD can skip building if this exact commit is merged without squash)
      tag_suffix: sha-${{ github.event.pull_request.head.sha }}
      # Detect changes against the PR base branch
      base_ref: origin/${{ github.event.pull_request.base.ref }}

  ci-success:
    name: CI Success
    runs-on: ubuntu-latest
    needs: [quality-checks, validate-helm, build-images]
    if: always()

    steps:
      - name: Check CI status
        run: |
          if [ "${{ needs.quality-checks.result }}" != "success" ] || \
             [ "${{ needs.validate-helm.result }}" != "success" ] || \
             [ "${{ needs.build-images.result }}" != "success" ]; then
            echo "❌ CI failed"
            exit 1
          fi
          echo "✅ All CI checks passed!"
