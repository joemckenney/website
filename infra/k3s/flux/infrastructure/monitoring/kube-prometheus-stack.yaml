---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: monitoring
  namespace: monitoring
spec:
  interval: 1h
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "68.x"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 24h
  values:
    grafana:
      enabled: true

      # No ingress — Cloudflare Tunnel handles routing
      ingress:
        enabled: false

      persistence:
        enabled: true
        size: 5Gi
        storageClassName: local-path

      grafana.ini:
        server:
          root_url: https://o11y.crowprose.com

        auth:
          disable_login_form: true
          disable_signout_menu: false

        auth.google:
          enabled: true
          allow_sign_up: true
          auto_login: true
          scopes: openid email profile
          auth_url: https://accounts.google.com/o/oauth2/auth
          token_url: https://accounts.google.com/o/oauth2/token
          api_url: https://openidconnect.googleapis.com/v1/userinfo
          allowed_emails: j.mckenney00@gmail.com

        users:
          auto_assign_org_role: Admin

      assertNoLeakedSecrets: false

      resources:
        limits:
          cpu: 200m
          memory: 384Mi
        requests:
          cpu: 50m
          memory: 128Mi

    prometheus:
      enabled: true
      prometheusSpec:
        retention: 30d
        retentionSize: "20GB"
        resources:
          limits:
            cpu: 500m
            memory: 1Gi
          requests:
            cpu: 100m
            memory: 512Mi
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 25Gi
        serviceMonitorSelector:
          matchLabels:
            release: monitoring

    alertmanager:
      enabled: false

    nodeExporter:
      enabled: true

    kubeStateMetrics:
      enabled: true

    # k3s uses different paths for these components
    kubeEtcd:
      enabled: false
    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeProxy:
      enabled: false

    # Custom alerting rules
    additionalPrometheusRulesMap:
      custom-alerts:
        groups:
          - name: critical
            rules:
              - alert: PodCrashLooping
                expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.2
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "Pod {{ $labels.pod }} is crash looping"
                  description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has restarted more than 3 times in 15 minutes"

              - alert: PodNotReady
                expr: kube_pod_status_ready{condition="false"} == 1
                for: 10m
                labels:
                  severity: critical
                annotations:
                  summary: "Pod {{ $labels.pod }} not ready"
                  description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been not ready for 10 minutes"

              - alert: PVCAlmostFull
                expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
                for: 5m
                labels:
                  severity: critical
                annotations:
                  summary: "PVC {{ $labels.persistentvolumeclaim }} almost full"
                  description: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

          - name: warning
            rules:
              - alert: HighMemoryUsage
                expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "High memory usage on {{ $labels.instance }}"
                  description: "Memory usage is above 85% for 10 minutes"

              - alert: HighCPUUsage
                expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
                for: 10m
                labels:
                  severity: warning
                annotations:
                  summary: "High CPU usage on {{ $labels.instance }}"
                  description: "CPU usage is above 85% for 10 minutes"

  valuesFrom:
    - kind: Secret
      name: grafana-oauth-secrets
      valuesKey: clientId
      targetPath: grafana."grafana\.ini"."auth\.google".client_id
    - kind: Secret
      name: grafana-oauth-secrets
      valuesKey: clientSecret
      targetPath: grafana."grafana\.ini"."auth\.google".client_secret
