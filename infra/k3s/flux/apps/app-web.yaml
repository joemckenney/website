---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-web
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: ./apps/dashboard/helm
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
      valuesFiles:
        - ./apps/dashboard/helm/values.yaml
        - ./apps/dashboard/helm/values-selfhosted.yaml
  values:
    image:
      tag: selfhosted-sha-45fe797694db8bb91c1b220381af57b696624911
