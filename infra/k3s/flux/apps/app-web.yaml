---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-web
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: ./apps/dashboard/helm
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
      valuesFiles:
        - ./apps/dashboard/helm/values.yaml
        - ./apps/dashboard/helm/values-selfhosted.yaml
  values:
    image:
      tag: selfhosted-sha-b666e0f1e44d72357ce45fc801d0a7a8abd0950e
