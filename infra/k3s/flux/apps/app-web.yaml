---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: app-web
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: ./apps/dashboard/helm
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
      valuesFiles:
        - values.yaml
        - values-selfhosted.yaml
  values:
    image:
      tag: latest
