---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: api-service
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: ./services/@gateway/service/helm
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
      valuesFiles:
        - ./services/@gateway/service/helm/values.yaml
        - ./services/@gateway/service/helm/values-selfhosted.yaml
  values:
    image:
      tag: selfhosted-sha-c8b07b430f39a4ced089d2f0d8933edc56f9c1af
  valuesFrom:
    - kind: Secret
      name: api-service-secrets-values
      valuesKey: googleClientId
      targetPath: secrets.googleClientId
    - kind: Secret
      name: api-service-secrets-values
      valuesKey: googleClientSecret
      targetPath: secrets.googleClientSecret
    - kind: Secret
      name: api-service-secrets-values
      valuesKey: jwtSecret
      targetPath: secrets.jwtSecret
