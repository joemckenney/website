---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: agent-service
  namespace: default
spec:
  interval: 30m
  chart:
    spec:
      chart: ./services/@agent/service/helm
      sourceRef:
        kind: GitRepository
        name: flux-system
        namespace: flux-system
      reconcileStrategy: Revision
      valuesFiles:
        - ./services/@agent/service/helm/values.yaml
        - ./services/@agent/service/helm/values-selfhosted.yaml
  values:
    image:
      tag: selfhosted-sha-c8b07b430f39a4ced089d2f0d8933edc56f9c1af
  valuesFrom:
    - kind: Secret
      name: agent-service-secrets-values
      valuesKey: databaseUrl
      targetPath: secrets.databaseUrl
    - kind: Secret
      name: agent-service-secrets-values
      valuesKey: anthropicApiKey
      targetPath: secrets.anthropicApiKey
    - kind: Secret
      name: agent-service-secrets-values
      valuesKey: braveApiKey
      targetPath: secrets.braveApiKey
