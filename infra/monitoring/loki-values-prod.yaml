# Loki stack for log aggregation
# Install with: KUBECONFIG=~/.kube/vultr-prod-config helm install loki grafana/loki-stack -f loki-values-prod.yaml

loki:
  enabled: true
  persistence:
    enabled: true
    size: 10Gi
  resources:
    limits:
      cpu: 200m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 128Mi

promtail:
  enabled: true
  resources:
    limits:
      cpu: 100m
      memory: 128Mi
    requests:
      cpu: 20m
      memory: 64Mi

grafana:
  enabled: false  # Already have Grafana installed
