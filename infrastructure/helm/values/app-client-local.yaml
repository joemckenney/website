# Local Minikube environment values for app-client
replicaCount: 1

image:
  repository: localhost:5000/app-client  # Local registry
  tag: latest
  pullPolicy: IfNotPresent  # Try local first, then registry

ingress:
  enabled: true
  className: "nginx"
  annotations: {}
  hosts:
    - host: client.local.com
      paths:
        - path: /
          pathType: Prefix
  tls: []  # No TLS locally

resources:
  limits:
    cpu: 200m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 32Mi
