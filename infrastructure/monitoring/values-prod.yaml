# Prometheus + Grafana stack for o11y.joemckenney.com
# Install with:
#   KUBECONFIG=~/.kube/vultr-prod-config helm install monitoring prometheus-community/kube-prometheus-stack \
#     -f infrastructure/monitoring/values-prod.yaml \
#     --set grafana."grafana\.ini".auth\.google.client_id="$GOOGLE_CLIENT_ID" \
#     --set grafana."grafana\.ini".auth\.google.client_secret="$GOOGLE_CLIENT_SECRET"

# Grafana configuration
grafana:
  enabled: true

  # Sidecars disabled - Vultr's K8s API has SSL cert issues
  # Manually configure datasource and import dashboards in Grafana UI
  sidecar:
    dashboards:
      enabled: false
    datasources:
      enabled: false

  ingress:
    enabled: true
    ingressClassName: nginx
    annotations:
      cert-manager.io/cluster-issuer: "letsencrypt-prod"
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
    hosts:
      - o11y.joemckenney.com
    tls:
      - secretName: grafana-tls
        hosts:
          - o11y.joemckenney.com

  persistence:
    enabled: true
    size: 5Gi

  grafana.ini:
    server:
      root_url: https://o11y.joemckenney.com

    auth:
      disable_login_form: true
      disable_signout_menu: false

    auth.google:
      enabled: true
      allow_sign_up: true
      auto_login: true
      # Set via: --set grafana."grafana\.ini"."auth\.google".client_id="..." --set grafana."grafana\.ini"."auth\.google".client_secret="..."
      client_id: ""
      client_secret: ""
      scopes: openid email profile
      auth_url: https://accounts.google.com/o/oauth2/auth
      token_url: https://accounts.google.com/o/oauth2/token
      api_url: https://openidconnect.googleapis.com/v1/userinfo
      # IMPORTANT: Only allow your email
      allowed_emails: j.mckenney00@gmail.com

    users:
      auto_assign_org_role: Admin

  # Disable leaked secrets check (we're using OAuth, not admin password)
  assertNoLeakedSecrets: false

  resources:
    limits:
      cpu: 150m
      memory: 256Mi
    requests:
      cpu: 25m
      memory: 128Mi

# Prometheus configuration
prometheus:
  enabled: true

  prometheusSpec:
    retention: 15d
    retentionSize: "8GB"

    resources:
      limits:
        cpu: 300m
        memory: 768Mi
      requests:
        cpu: 50m
        memory: 256Mi

    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 10Gi

# Alertmanager - sends alert notifications via email
alertmanager:
  enabled: true
  config:
    global:
      smtp_from: "alerts@joemckenney.com"
      smtp_smarthost: "smtp.gmail.com:587"
      smtp_auth_username: "j.mckenney00@gmail.com"
      # Set via --set alertmanager.config.global.smtp_auth_password="your-gmail-app-password"
      smtp_auth_password: ""
    route:
      receiver: "email"
      group_by: ["alertname", "namespace"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        # Route InfoInhibitor and Watchdog to null (they're meta-alerts, not real problems)
        - receiver: "null"
          matchers:
            - alertname =~ "InfoInhibitor|Watchdog"
        # Route info-level alerts to null (too noisy)
        - receiver: "null"
          matchers:
            - severity = "info"
    inhibit_rules:
      # Inhibit info alerts when InfoInhibitor is firing for the same namespace
      - source_matchers:
          - alertname = "InfoInhibitor"
        target_matchers:
          - severity = "info"
        equal: ["namespace"]
    receivers:
      - name: "null"
      - name: "email"
        email_configs:
          - to: "j.mckenney00@gmail.com"
            send_resolved: true

# Custom alerting rules
additionalPrometheusRulesMap:
  custom-alerts:
    groups:
      - name: critical
        rules:
          - alert: PodCrashLooping
            expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.2
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} is crash looping"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has restarted more than 3 times in 15 minutes"

          - alert: PodNotReady
            expr: kube_pod_status_ready{condition="false"} == 1
            for: 10m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.pod }} not ready"
              description: "Pod {{ $labels.pod }} in {{ $labels.namespace }} has been not ready for 10 minutes"

          - alert: NodeNotReady
            expr: kube_node_status_condition{condition="Ready",status="true"} == 0
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "Node {{ $labels.node }} not ready"
              description: "Node {{ $labels.node }} has been not ready for 5 minutes"

          - alert: PVCAlmostFull
            expr: kubelet_volume_stats_used_bytes / kubelet_volume_stats_capacity_bytes > 0.85
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "PVC {{ $labels.persistentvolumeclaim }} almost full"
              description: "PVC {{ $labels.persistentvolumeclaim }} is {{ $value | humanizePercentage }} full"

      - name: warning
        rules:
          - alert: HighMemoryUsage
            expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High memory usage on {{ $labels.instance }}"
              description: "Memory usage is above 85% for 10 minutes"

          - alert: HighCPUUsage
            expr: 100 - (avg by(instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 85
            for: 10m
            labels:
              severity: warning
            annotations:
              summary: "High CPU usage on {{ $labels.instance }}"
              description: "CPU usage is above 85% for 10 minutes"

          - alert: PrometheusStorageAlmostFull
            expr: prometheus_tsdb_storage_blocks_bytes / (10 * 1024 * 1024 * 1024) > 0.8
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Prometheus storage almost full"
              description: "Prometheus storage is above 80% of 10GB limit"

      - name: http
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(nginx_ingress_controller_requests{status=~"5.."}[5m])) by (ingress)
              /
              sum(rate(nginx_ingress_controller_requests[5m])) by (ingress)
              > 0.05
            for: 5m
            labels:
              severity: critical
            annotations:
              summary: "High 5xx error rate on {{ $labels.ingress }}"
              description: "{{ $labels.ingress }} has >5% error rate"

          - alert: HighResponseTime
            expr: |
              histogram_quantile(0.95,
                sum(rate(nginx_ingress_controller_request_duration_seconds_bucket[5m])) by (le, ingress)
              ) > 2
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "High response time on {{ $labels.ingress }}"
              description: "95th percentile response time is above 2 seconds on {{ $labels.ingress }}"

# Node exporter - collects node-level metrics
nodeExporter:
  enabled: true

# kube-state-metrics - collects Kubernetes object metrics
kubeStateMetrics:
  enabled: true

# Disable components not needed for small clusters
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
