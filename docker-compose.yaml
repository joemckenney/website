# Development databases for all services
# Start with: docker compose up -d
# Stop with: docker compose down

services:
  users-db:
    image: postgres:16
    container_name: users-db
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 5s
      retries: 5

  agent-db:
    image: postgres:16
    container_name: agent-db
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: agent
    ports:
      - "5433:5432"
    volumes:
      - agent-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  users-db-data:
  agent-db-data:
