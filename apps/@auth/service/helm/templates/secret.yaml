apiVersion: v1
kind: Secret
metadata:
  name: {{ include "auth-service.fullname" . }}-secrets
  labels:
    {{- include "auth-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  googleClientId: {{ .Values.secrets.googleClientId | quote }}
  googleClientSecret: {{ .Values.secrets.googleClientSecret | quote }}
  googleRedirectUri: {{ .Values.secrets.googleRedirectUri | quote }}
  jwtSecret: {{ .Values.secrets.jwtSecret | quote }}
  allowedEmail: {{ .Values.secrets.allowedEmail | quote }}
  frontendUrl: {{ .Values.secrets.frontendUrl | quote }}
