# Production values for www-app (www.joemckenney.com)
replicaCount: 1

image:
  repository: crowprose/www-app
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/from-to-www-redirect: "true"
  hosts:
    - host: www.joemckenney.com
      paths:
        - path: /
          pathType: Prefix
    - host: joemckenney.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: www-app-tls
      hosts:
        - www.joemckenney.com
        - joemckenney.com

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
