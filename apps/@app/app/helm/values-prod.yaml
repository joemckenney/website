# Production values for app-client (app.joemckenney.com)
replicaCount: 1

image:
  repository: crowprose/app-client
  pullPolicy: Always
  tag: "latest"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: app.joemckenney.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: app-client-tls
      hosts:
        - app.joemckenney.com

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
