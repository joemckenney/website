replicaCount: 2

image:
  repository: crowprose/user-service
  pullPolicy: IfNotPresent
  tag: "latest"

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3002"
  - name: LOG_LEVEL
    value: "info"

secrets:
  databaseUrl: "" # Set via --set flag
