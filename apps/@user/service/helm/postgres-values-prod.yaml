# Production PostgreSQL values for user-service
# Deploy with: KUBECONFIG=~/.kube/vultr-prod-config helm install user-postgres bitnami/postgresql -f postgres-values-prod.yaml

auth:
  # IMPORTANT: Set a strong password before deploying!
  # You can override this with --set auth.password=<your-password>
  postgresPassword: ""
  username: users
  password: ""
  database: users

primary:
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""  # Uses cluster default
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 100m
      memory: 256Mi

# Enable metrics for monitoring (optional)
metrics:
  enabled: false
