services:
  postgres:
    image: postgres:16
    container_name: agent-service-postgres
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: agent
    ports:
      - "5433:5432"
    volumes:
      - agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  agent-postgres-data:
