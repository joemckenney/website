# Self-hosted values for agent-service
# Deployed to k3s via FluxCD — internal service (no ingress)
# Secrets injected via FluxCD valuesFrom (see infra/k3s/flux/apps/agent-service.yaml)
replicaCount: 1

image:
  repository: crowprose/agent-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3003
  targetPort: 3003

# Internal service — no ingress
ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3003"

# Agent configuration
agent:
  model: "claude-sonnet-4-20250514"
  maxTokens: "4096"
  systemPrompt: "You are a helpful AI assistant with access to web search. Be concise and helpful."

# MCP service URLs
tables:
  serviceUrl: "http://tables-service:3005"

# Prometheus metrics
metrics:
  enabled: true

# Database migrations
migration:
  enabled: true
  image:
    repository: crowprose/agent-service-migrate
    pullPolicy: IfNotPresent
    tag: ""
