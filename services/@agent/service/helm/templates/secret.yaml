apiVersion: v1
kind: Secret
metadata:
  name: {{ include "agent-service.fullname" . }}-secrets
  labels:
    {{- include "agent-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- if .Values.secrets.braveApiKey }}
  braveApiKey: {{ .Values.secrets.braveApiKey | quote }}
  {{- end }}
