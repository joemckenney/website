# Production values for user-service
# Secrets are injected via GitHub Actions using --set flags
replicaCount: 1

image:
  repository: crowprose/user-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 3002
  targetPort: 3002

# No ingress - internal service only
ingress:
  enabled: false

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3002"
  - name: LOG_LEVEL
    value: "info"

# Secrets - injected via GHA secrets (see cd.yml)
secrets:
  databaseUrl: ""

# Prometheus metrics
metrics:
  enabled: true

# Database migrations
migration:
  enabled: true
  image:
    repository: crowprose/user-db-migrate
    pullPolicy: IfNotPresent
    tag: ""  # defaults to .Values.image.tag (set via --set image.tag=...)
