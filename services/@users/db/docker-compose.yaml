services:
  postgres:
    image: postgres:16
    container_name: user-service-postgres
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - user-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  user-postgres-data:
