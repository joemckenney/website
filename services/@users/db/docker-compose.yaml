# Users database for local development
# Start: pnpm run db:up (or docker compose up -d --wait)
# Stop: pnpm run db:down (or docker compose down)

name: users-db

services:
  postgres:
    image: postgres:16
    container_name: users-db
    environment:
      POSTGRES_USER: users
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: users
    ports:
      - "5432:5432"
    volumes:
      - users-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U users -d users"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  users-db-data:
