# Production values for api-service (api.joemckenney.com)
# Secrets are injected via GitHub Actions using --set flags
replicaCount: 1

image:
  repository: crowprose/api-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 3000
  targetPort: 3000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.joemckenney.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: api-service-tls
      hosts:
        - api.joemckenney.com

resources:
  limits:
    cpu: 100m
    memory: 256Mi
  requests:
    cpu: 50m
    memory: 128Mi

env:
  - name: OTEL_SERVICE_NAME
    value: "api-gateway"
  - name: OTEL_EXPORTER_OTLP_ENDPOINT
    value: "http://tempo:4318"

nodeSelector: {}
tolerations: []
affinity: {}

# Secrets - injected via GHA secrets (see cd.yml)
# These are placeholder values that get overridden by --set flags
secrets:
  googleClientId: ""
  googleClientSecret: ""
  googleRedirectUri: "https://api.joemckenney.com/auth/google/callback"
  jwtSecret: ""
  allowedEmails: "j.mckenney00@gmail.com"
  frontendUrl: "https://app.joemckenney.com"
  backendUrl: "https://api.joemckenney.com"
  userServiceUrl: "http://user-service:3002"
  agentServiceUrl: "http://agent-service:3003"
  tablesServiceUrl: "http://tables-service:3005"

# Tables service sharding config
tablesSharding:
  headlessService: "tables-service-headless"
  port: 3005
  shardCount: 2

# Prometheus metrics
metrics:
  enabled: true
