apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "app-server.fullname" . }}
  labels:
    {{- include "app-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "app-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "app-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "app-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 25
          periodSeconds: 5
          failureThreshold: 6
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        - name: GOOGLE_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: googleClientId
        - name: GOOGLE_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: googleClientSecret
        - name: GOOGLE_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: googleRedirectUri
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: jwtSecret
        - name: ALLOWED_EMAIL
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: allowedEmail
        - name: FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: frontendUrl
        - name: BACKEND_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: backendUrl
        - name: USER_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: userServiceUrl
        - name: AGENT_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: agentServiceUrl
        - name: STRAVA_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: stravaServiceUrl
        - name: TABLES_SERVICE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "app-server.fullname" . }}-secrets
              key: tablesServiceUrl
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
