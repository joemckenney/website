apiVersion: v1
kind: Secret
metadata:
  name: {{ include "weather-service.fullname" . }}-secrets
  labels:
    {{- include "weather-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  awnApiKey: {{ .Values.secrets.awnApiKey | quote }}
  awnAppKey: {{ .Values.secrets.awnAppKey | quote }}
  awnMacAddress: {{ .Values.secrets.awnMacAddress | quote }}
