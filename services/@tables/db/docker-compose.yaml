# Tables database for local development
# Start: pnpm run db:up (or docker compose up -d --wait)
# Stop: pnpm run db:down (or docker compose down)

name: tables-db

services:
  postgres:
    image: postgres:16
    container_name: tables-db
    environment:
      POSTGRES_USER: tables
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: tables
    ports:
      - "5434:5432"
    volumes:
      - tables-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tables -d tables"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  tables-db-data:
