replicaCount: 1

image:
  repository: tables-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false

service:
  type: ClusterIP
  port: 3005
  targetPort: 3005

# No ingress - internal service only (accessed via gateway)
ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3005"

secrets:
  databaseUrl: ""
  anthropicApiKey: ""

# Agent model configuration (non-sensitive)
agentModel: "claude-sonnet-4-20250514"

# Prometheus metrics
metrics:
  enabled: false

# Database migrations
migration:
  enabled: true
  image:
    repository: tables-service-migrate
    pullPolicy: IfNotPresent
    tag: ""  # defaults to .Values.image.tag
