# Production values for tables-service
# Secrets are injected via GitHub Actions using --set flags
replicaCount: 1

image:
  repository: crowprose/tables-service
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

service:
  type: ClusterIP
  port: 3005
  targetPort: 3005

# No ingress - internal service only (accessed via gateway)
ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3005"

# Agent model configuration
agentModel: "claude-sonnet-4-20250514"

# Secrets - injected via GHA secrets (see cd.yml)
# These are placeholder values that get overridden by --set flags
secrets:
  databaseUrl: ""
  anthropicApiKey: ""

# Prometheus metrics
metrics:
  enabled: true

# Database migrations
migration:
  enabled: true
  image:
    repository: crowprose/tables-service-migrate
    pullPolicy: IfNotPresent
    tag: ""  # defaults to .Values.image.tag
