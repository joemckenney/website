# Self-hosted values for tables-service
# Deployed to k3s via FluxCD — internal service (no ingress)
# Secrets injected via FluxCD valuesFrom (see infra/k3s/flux/apps/tables-service.yaml)
# Single replica on self-hosted (no sharding)
replicaCount: 1

image:
  repository: crowprose/tables-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 3005
  targetPort: 3005

# Internal service — no ingress
ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 256Mi

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3005"

# Agent model configuration
agentModel: "claude-sonnet-4-20250514"

# Prometheus metrics
metrics:
  enabled: true

# Database migrations
migration:
  enabled: true
  image:
    repository: crowprose/tables-service-migrate
    pullPolicy: IfNotPresent
    tag: ""
