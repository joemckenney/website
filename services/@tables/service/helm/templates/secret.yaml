apiVersion: v1
kind: Secret
metadata:
  name: {{ include "tables-service.fullname" . }}-secrets
  labels:
    {{- include "tables-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  {{- if .Values.secrets.anthropicApiKey }}
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | quote }}
  {{- end }}
