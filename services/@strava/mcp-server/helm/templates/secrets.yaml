apiVersion: v1
kind: Secret
metadata:
  name: {{ include "strava-mcp-server.fullname" . }}-secrets
  labels:
    {{- include "strava-mcp-server.labels" . | nindent 4 }}
type: Opaque
stringData:
  databaseUrl: {{ .Values.secrets.databaseUrl | quote }}
  stravaClientId: {{ .Values.secrets.stravaClientId | quote }}
  stravaClientSecret: {{ .Values.secrets.stravaClientSecret | quote }}
  stravaRedirectUri: {{ .Values.secrets.stravaRedirectUri | quote }}
  encryptionKey: {{ .Values.secrets.encryptionKey | quote }}
  frontendUrl: {{ .Values.secrets.frontendUrl | quote }}
