apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "strava-mcp-server.fullname" . }}
  labels:
    {{- include "strava-mcp-server.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "strava-mcp-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "strava-mcp-server.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "strava-mcp-server.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
      - name: {{ .Chart.Name }}
        securityContext:
          {{- toYaml .Values.securityContext | nindent 12 }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort }}
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ping
            port: http
          initialDelaySeconds: 5
          periodSeconds: 5
          failureThreshold: 6
        env:
        {{- range .Values.env }}
        - name: {{ .name }}
          value: {{ .value | quote }}
        {{- end }}
        # Secrets
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "strava-mcp-server.fullname" . }}-secrets
              key: databaseUrl
        - name: STRAVA_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: {{ include "strava-mcp-server.fullname" . }}-secrets
              key: stravaClientId
        - name: STRAVA_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: {{ include "strava-mcp-server.fullname" . }}-secrets
              key: stravaClientSecret
        - name: STRAVA_REDIRECT_URI
          valueFrom:
            secretKeyRef:
              name: {{ include "strava-mcp-server.fullname" . }}-secrets
              key: stravaRedirectUri
        - name: ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: {{ include "strava-mcp-server.fullname" . }}-secrets
              key: encryptionKey
        - name: FRONTEND_URL
          valueFrom:
            secretKeyRef:
              name: {{ include "strava-mcp-server.fullname" . }}-secrets
              key: frontendUrl
        resources:
          {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
