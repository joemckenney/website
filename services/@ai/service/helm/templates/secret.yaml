apiVersion: v1
kind: Secret
metadata:
  name: {{ include "ai-service.fullname" . }}-secrets
  labels:
    {{- include "ai-service.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  vercelApiKey: {{ .Values.secrets.vercelApiKey | quote }}
  anthropicApiKey: {{ .Values.secrets.anthropicApiKey | quote }}
