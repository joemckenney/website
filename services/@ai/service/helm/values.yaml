replicaCount: 1

image:
  repository: ai-service
  pullPolicy: IfNotPresent
  tag: "latest"

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 3006

ingress:
  enabled: false

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

livenessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 30
  periodSeconds: 10

readinessProbe:
  httpGet:
    path: /health
    port: http
  initialDelaySeconds: 5
  periodSeconds: 5
  failureThreshold: 6

autoscaling:
  enabled: false

env:
  - name: NODE_ENV
    value: "production"
  - name: PORT
    value: "3006"
  - name: LOG_LEVEL
    value: "info"
  - name: OLLAMA_BASE_URL
    value: "http://localhost:11434/v1"
  - name: ALLOWED_MODELS
    value: ""

secrets:
  vercelApiKey: ""
  anthropicApiKey: ""

metrics:
  enabled: false
